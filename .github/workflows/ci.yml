name: Afrixa CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/phase-*"]

permissions:
  contents: read

concurrency:
  group: afrixa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Financial SQL integration tests
        run: |
          cd .sqlcheck
          npm ci
          node phase3-finance.mjs
      - name: Production build
        run: npm run build
