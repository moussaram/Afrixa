name: Afrixa CI

on:
  push:
    branches:
      - feat/responsive-desktop-tablet-layout-20261118
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_SUPABASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: example.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: ci-placeholder
          VITE_FIREBASE_MEASUREMENT_ID: G-CI00000000
          VITE_FIREBASE_VAPID_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_API_KEY: ci-placeholder
        run: npm run build

  lint:
    name: Layout ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint src/App.tsx src/components/layout/DesktopShell.tsx src/components/layout/BottomNav.tsx src/components/stories/StoriesRail.tsx src/pages/Index.tsx src/pages/Orders.tsx src/pages/OrderDetail.tsx src/pages/SellerSales.tsx src/pages/SellerWallet.tsx

  edge-api-check:
    name: Edge API reliability checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check hardened Edge Function integrations
        run: >-
          deno check
          supabase/functions/_shared/http.ts
          supabase/functions/_shared/fedapay.ts
          supabase/functions/_shared/cloudflare.ts
          supabase/functions/moderate-image/index.ts
          supabase/functions/send-push-notification/index.ts\n          supabase/functions/confirm-marketplace-order/index.ts\n          supabase/functions/release-escrow/index.ts
      - name: Test bounded HTTP retries
        run: deno test supabase/functions/_shared/http_test.ts
